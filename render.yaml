# NOTE: Deployment has moved to Railway (backend) + Vercel (frontend).
# See backend/railway.json and frontend/vercel.json.
# This file is kept for reference only.

services:
  # Backend - Web Service
  - type: web
    name: eventnexus-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: JWT_EXPIRE
        value: 30d
      - key: ADMIN_SECRET_KEY
        sync: false   # Set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false   # Set manually in Render dashboard
      - key: FIRECRAWL_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your frontend Render URL, e.g. https://eventnexus.onrender.com

  # Frontend - Static Site
  - type: web
    name: eventnexus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to your backend Render URL, e.g. https://eventnexus-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
